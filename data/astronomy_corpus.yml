- - what is a black hole?
  - A black hole is one of the strangest objects in space. It is an area in space where gravity is so strong that even light cannot escape from it. Since light cannot escape from a black hole, it appears black. Light can travel faster than anything we know of - at a speed of 186,000 miles (300,000 kilometers) per second. If light cannot escape from a black hole, nothing else that we know of can. A black hole is not really a hole since it is not empty. In fact its extreme gravity comes from the fact that it has a lot of mass crammed into a very small volume. Since the pull of gravity from any object is determined by how much mass it has AND how close you can get to all of that mass; then, from far away, a black hole's gravitational pull is similar to other objects of the same mass, but, unlike other objects, you can get a lot closer to all that mass and, once you do, you will keep falling to its center and can never escape!
- - who discovered mars?
  - There is no single person who is credited with the discovery of Mars. Mars is one of the five planets that can be seen in the night sky without using a telescope or binoculars. Since Mars is bright and has a reddish color, it stands out and is easily noticed. The planet Mars has been known since ancient times and was observed for thousands of years by the people of many different cultures.
- - how did our universe begin and how will it end?
  - 'Why is our Universe the way we see it to be? And what will ultimately become of it? These are two fundamental questions which have long interested humankind. Since the 1929 discovery that Universe is expanding, we have made some significant steps in understanding how the Universe began and how it must have evolved to be what it is today. We know this: galaxies and clusters of galaxies formed from tiny fluctuations in the early Universe. We can measure these fluctuations by mapping the cosmic background radiation and relate them to the structures which we observe today. However, many challenges remain such as: In the 1920s, Edwin Hubble used the 100" telescope (2.5 meters) at the Mount Wilson Observatory in California to detect variable stars in nebulae. He discovered that the stars he observed had the same characteristic variations in their brightness as a class of stars called Cepheid Variables. Earlier, astronomer Henrietta Levitt had shown there was a precise correlation between
    the periodic change in brightness of a Cepheid Variable and its luminosity. Hubble was able use this correlation to show that the nebulae containing the variable stars he observed were not within our own Galaxy; they were in external galaxies far beyond the edge of our Milky Way.'
- - what is dark matter?
  - In general, astronomers learn about the Universe by the electromagnetic radiation (or light) that we see from it. The light we see is in the form of radio waves, infrared, optical, ultraviolet, X-ray, and gamma-ray emission. But what if there is material in the Universe that does not glow? How will we ever know it is there? How can we tell how much of it there is? How do we know what it is? Such material is called "dark matter", and astronomers now believe that most of the material in the Universe is made of this stuff. It is material that does not emit sufficient light for us to directly detect it, yet there are a variety of ways that we can indirectly detect it. The most common method involves the fact that dark matter has a gravitational pull on both the light and the sources of light that we can see. From the effects of "extra" gravity that we detect, we infer how much mass must be present.
- - how did the known structures in the universe evolve?
  - 'The question of evolution of structures in the Universe is perhaps the central question of astronomy. After all, astronomers are "historians of the Universe": since light travels with finite speed, looking "far in the distance" is looking "far back in time". Observations of the farthest reaches of the Universe show that it is ''lumpy'', with well developed structures that are very old. We detect galaxies and clusters of galaxies as far back in time as we can see, when the Universe was about one fifth of its current age. However, we still do not understand how these structures condensed out of the ''primordial soup''. The formation of structure appears much quicker than the current theories would have it!'
- - how do massive black holes grow?
  - Black holes up to about 50 times the mass of our Sun can be formed by normal processes in very massive stars. This can happen throughout galaxies wherever stars have formed recently. One way to grow a more massive black hole is for a seed black hole in a dense galactic nucleus to swallow up gas and normal stars. Under the right conditions, a thousand solar mass black hole can grow to millions or billions of times the mass of the Sun in a fraction of the lifetime of the Universe. Alternatively, gas in a dense galactic nucleus can get so concentrated that a supermassive star will form and evolve quickly to produce a massive black hole of up to 1000 solar masses. This grows either by accretion or via mergers with other black holes of similar mass. Currently, astronomers don't know which of these processes is the more common method for generating a massive black hole.
- - what is dark energy and why is the universe expanding ever faster?
  - The discovery in 1998 that the Universe is actually speeding up its expansion was a total shock to astronomers. It just seems so counter-intuitive, so against common sense. But the evidence has become convincing. The evidence came from studying distant Type Ia supernovae. This type of supernova results from having a white dwarf star in a binary system. Matter transfers from the normal star to the white dwarf until the white dwarf attains a critical mass (the Chandrasekhar limit) and undergoes a thermonuclear explosion. Because all white dwarfs achieve the same mass before exploding, they all achieve the same luminosity and can be used by astronomers as "standard candles." Thus by observing their apparent brightness, astronomers can determine their distance using the 1/r2 law.
- - what is the difference between an asteroid and a comet?
  - The main difference between asteroids and comets is their composition, as in, what they are made of. Asteroids are made up of metals and rocky material, while comets are made up of ice, dust and rocky material. Both asteroids and comets were formed early in the history of the solar system about 4.5 billion years ago. Asteroids formed much closer to the Sun, where it was too warm for ices to remain solid. Comets formed farther from the Sun where ices would not melt. Comets which approach the Sun lose material with each orbit because some of their ice melts and vaporizes to form a tail.
- - have any spacecraft landed on an asteroid?
  - Yes, and there are several examples! On February 12, 2001 flight controllers landed NASA's NEAR spacecraft on an asteroid called Eros. NEAR was the first spacecraft to orbit and touchdown on the surface of an asteroid. NEAR began orbiting Eros a year earlier, on February 14, 2000. The spacecraft collected close up photographs and measured the size and shape of Eros before landing. Eros is the largest of the asteroids whose orbits cross the orbit of the Earth. NASA's OSIRIS-REx spacecraft traveled to near-Earth asteroid Bennu and is bringing a small sample back to Earth for study. The mission launched Sept. 8, 2016, from Cape Canaveral Air Force Station. The spacecraft reached Bennu in 2018 and will return a sample to Earth in 2023. For more information, visit the NASA OSIRIS-REx website. Japan's Hayabusa2 spacecraft launched in 2014 on a mission to survey asteroid Ryugu and collect a surface sample for return to Earth. In 2020 the samples were returned to Earth for further study. For
    more information, visit JAXA's Hayabusa2 website. While it's primary mission was to study and land on a comet rather than an asteroid, the ESA Rosetta cornerstone mission studied the Jupiter-family comet 67P/Churyumov-Gerasimenko with a combination of remote sensing and in situ measurements. The spacecraft arrived at the comet in August 2014 following a 10-year journey. On November 12, 2014, Rosetta's lander Philae was deployed to the surface. Philae carried a suite of instruments for imaging and sampling the comet nucleus. The mission ended in a controlled landing on the comet's surface on September 30, 2016. For more information visit the ESA Rosetta website. NASA's Deep Impact mission studied Comet Tempel 1. The spacecraft delivered an impactor into the path of Tempel 1 to reveal never-before-seen materials and provide clues about the internal composition and structure of a comet. On July 4, 2005 the impactor intercepted Tempel 1 revealing that the comet's surface layer is very porous,
    and that that hyperactive comets are driven by carbon dioxide. For more information, visit NASA's Deep Impact website.
- - can an asteroid hit earth?
  - It is possible that an asteroid may hit Earth, but the chances of this happening are very small. Small objects - meteors and debris from comets - hit the Earth relatively often, but they are typically small objects and burn up before impacting the surface. For more information, see NASA's meteors and meteorites webpage. Near-Earth objects (NEOs) are asteroids and comets that orbit the Sun like the planets, but their orbits can bring them into Earth’s neighborhood - within 30 million miles of Earth’s orbit. NASA and the University of Arizona are developing the NEO Surveyor mission - a planetary defense mission designed to respond to the objectives of NASA’s Planetary Defense Coordination Office by detecting, cataloguing, and characterizing NEOs larger than 140 meters. In doing so, the NEO Surveyor mission provides critical decision support to NASA and other decision-makers who must assess the risks of NEO impacts to Earth and must identify potential mitigation strategies. For more information,
    visit the NEO Surveyor website. In 2018, NASA/JPL-Caltech released a map of all known Near-Earth Objects. For more information, see the map on this webpage. NASA/JPL's Center for Near-Earth Oject Studies (CNEOS) also maintains a comprehensive and current set of information about all known NEOs. See the CNEOS website for more information.
- - can you really walk on an asteroid like in some movies?
  - Since asteroids are generally small, their gravity is very weak. An astronaut standing on an asteroid would weigh very little and would tend to float more than walk.
- - can asteroids have moons?
  - Yes, asteroids can have moons! Some of the larger asteroids in our Solar System actually do have moons. In 1993, an tiny moon called Dactyl was discovered orbiting the large asteroid Ida. Dactyl is only about 1 mile wide, while Ida is about 19 miles across. Since then, several other moons have been discovered orbiting asteroids. In 1999, an 8 mile wide moon called Petit-Prince was discovered orbiting the 135 mile wide asteroid Eugenia. In 2000, the 90 mile wide asteroid Pulcova was discovered to have its own moon, about nine miles wide. Over two dozen more have been discovered.
- - what is the largest asteroid?
  - The largest asteroid is called Ceres. It is about one-quarter the size of the moon and orbits the sun between Mars and Jupiter in a region called the asteroid belt. Unlike most asteroids, Ceres is spherical in shape. Ceres was discovered by the Italian astronomer Giuseppe Piazzi in 1801 as he searched for a planet which was predicted to exist between Mars and Jupiter. It was the first asteroid ever discovered. It is a dwarf planet.
- - what is the asteroid belt?
  - The asteroid belt is a region of space between the orbits of Mars and Jupiter where most of the asteroids in our Solar System are found orbiting the Sun. The asteroid belt probably contains millions of asteroids. Astronomers think that the asteroid belt is made up of material that was never able to form into a planet, or of the remains of a planet which broke apart a very long time ago. The asteroids in the asteroid belt come in a variety of sizes. Some are very small (less than a mile across), while others are quite large. The largest asteroid is called Ceres. It is about one-quarter the size of our moon. It is a dwarf planet.
- - what are asteroids?
  - Asteroids are rocky-metallic objects which range in size from about the size of pebbles to around 600 miles (~1,000 km) across. Although they orbit the Sun, they are too small to be considered planets. Asteroids are thought to be leftover material from the formation of our Solar System. Most are found in the Asteroid Belt, a doughnut-shaped ring which lies between the orbits of Mars and Jupiter. Astronomers have also identified a group of asteroids whose orbits cross Earth's orbit. Several hundred thousand asteroids are known to exist in our Solar System, and many are yet to be discovered. Most of the undiscovered asteroids are the smaller ones (less than 100 km across) which are more difficult to detect. It is estimated that there are over a million of these smaller asteroids.
- - how are black holes detected?
  - Black holes are detected as surrounding material (like gas) is funnelled by the force of gravity into a disk around the black hole. The gas molecules in the disk swirl around the black hole so fast that they heat up and emit X-rays. These X-rays can be detected from Earth. Black holes can also be detected by watching for motions of stars near the black hole.
- - could the sun become a black hole?
  - No, the Sun is much too small to ever become a black hole. A star has to be much more massive than the Sun before it can collapse into a black hole.
- - is there a black hole at the center of our galaxy?
  - Yes, there is a very large black hole at the center of our Galaxy. It has a mass of about three million suns and is very far from Earth at a distance of about 24,000 light-years. Huge black holes are thought to occur naturally at the center of most large galaxies and many have already been detected. The black hole which lies at the center of our Galaxy is much too far away to be of any danger to Earth.
- - how big is a black hole?
  - Black holes come in many sizes and their size depends on how much material is in them (their mass). Some are the remains of a giant star which collapsed. A star has to be much more massive than our Sun to become a black hole. These types of black holes are only a few miles across. Black holes have also been discovered in the centers of some galaxies. These black holes are very large and contain the same amount of material as 100 million or more suns. These types of black holes are several million miles across.
- - are there really black holes in space?
  - Since black holes do not put out any light, we cannot see them. However, we can see the effect that they have on the area of space around them. Since black holes have extremely high gravity, they pull in surrounding material at very high speeds, causing this material to become very hot and emit X-rays. By finding this very hot material which is spiraling into black holes, astronomers can identify where some of them are. Also, astronomers study the motions of objects in space to see where there is material that might be moving as if a black hole were affecting it. So far, evidence has been found for the existence of very massive black holes in the centers of several large galaxies, and much less massive black holes in binary star systems (where two stars orbit each other).
- - how are black holes made?
  - Scientists think that black holes are created in places where matter gets extremely dense (where a huge amount of material is crammed into an extremely small space). This can happen in the centers of large galaxies or when a giant star collapses and shrinks during the final phases of its life. When matter gets so dense that light cannot escape from it, the region that it is in becomes a black hole.
- - what is a meteor shower?
  - As a comet travels close to the Sun, it heats up and part of the comet vaporizes. After a comet has orbited the Sun many times, a lot of small pieces of the comet are left along the comet's path. A meteor shower happens when Earth passes through the path of a comet. When this happens, the bits of comet debris, most no larger than a grain of sand, create streaks of light in the night sky as they burn up in Earth's atmosphere. Bits of debris which enter Earth's atmosphere are called meteors. On any night, there are several small meteors which shoot across the sky. However, during a meteor shower, tens to hundreds of meteors can be seen each hour. Many of these meteor showers can be predicted and occur at the same time each year.
- - what is the size of a comet?
  - Most comets have a nucleus (the center of a comet) that is less than about 6 miles (10 km) wide. The size of a comet changes depending on how close it is to the sun. As a comet gets closer to the sun, the ices on the surface of its nucleus vaporize and form a cloud called a coma around the nucleus that can expand out to 50,000 miles (80,000 km). A tail also forms on a comet as it approaches the sun. Comet tails can be over 600,000 miles (1 million km) long.
- - did a comet really crash into jupiter?
  - Yes, between July 16 and July 22, 1994, several pieces of Comet Shoemaker-Levy 9 collided with Jupiter. It was the first collision of two solar system objects ever observed. The comet had been captured and broken apart by Jupiter's strong gravity. More than 20 fragments of the comet crashed into Jupiter's southern hemisphere at speeds of about 130,000 miles (210,000 km) per hour. The impacts released a lot of energy and created several large, dark scars in Jupiter's atmosphere which lasted for several weeks.
- - when will halley's comet return?
  - Halley's comet will next appear in the night sky in the year 2061. It orbits the sun every 75-76 years, so this is the time between appearances. Halley's comet was recorded by Edmund Halley in 1682. It was seen again in 1758, 1835, 1910, and 1986.
