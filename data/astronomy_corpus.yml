- - what is the structure and behavior of matter under extreme conditions?
  - 'In the Universe, there are many cases in which matter has evolved to extreme physical conditions. Examples include white dwarfs and neutron stars, where the gravitational force of collapse is balanced by the quantum forces exerted by electrons and nuclear matter. It also includes black holes, where the force of gravity has won out over all other forces and the mass density is so high that even light is gravitationally bound to the object. We can study these systems in more depth by studying the effects they have on the matter around them. Neutron stars and black holes found in galaxies often have binary companions that are so close that stellar material is transferred to the compact object. Black holes are also highly likely to be at the centers of most galaxies and have huge accretion disks around them. As matter falls closer to the compact object, it is heated to such an extreme temperature that X-rays are the primary form of emission. The X-ray emission is then the carrier of information
    that offers clues to the underlying compact object. So far, this emission has provided a number of insights into the structure of the matter in the vicinity of these objects:'
- - will einstein have the last word on gravity?
  - 'From tracing the way light bends around a neutron star to detecting the effects of a black hole tugging on space itself, X-ray astronomy is uniquely suited to testing and observing predictions of general relativity, Albert Einstein''s landmark 1915 theory of gravitation. Thus far, Einstein''s predictions are passing with flying colors. But will Einstein have the last word on gravity? X-ray astronomers hope to subject general relativity to even greater scrutiny by traveling (albeit virtually) to where gravity is at its extreme and the effects of general relativity most pronounced: the innermost regions of black holes and neutron stars. The payoff will be a greater understanding of the dominant force in the large-scale universe and, perhaps, a unified theory of the fundamental forces of nature – the central goal of physics today.'
- - how did the matter in the universe get to be so lumpy?
  - The Universe that we see today is very lumpy. There are planets, stars, galaxies, and clusters of galaxies. Yet when we look at the afterglow from the Big Bang, we see an incredibly smooth glow across the sky. So how did the matter in the Universe get to be so lumpy after starting out so smooth? Astronomers generally agree that gravity shaped the evolution of the lumps we see in the Universe today. The force of gravity between different chunks of matter caused the chunks to pull together into one body, and then that body pulled in more material, similar to a snowball rolling downhill, picking up more snow as it goes.
- - how did the elemental composition of the universe evolve?
  - Why do we observe the types and quantities of chemical elements in the Universe that we do? This is one of the most fundamental questions facing astronomers. The field of nucleosynthesis studies how the elements were created, and it draws from a wide range of studies, from the Big Bang to the formation and evolution of our solar system. Light elements (hydrogen, helium and lithium) were mainly created in the Big Bang. Measurement of the abundances of these elements can give scientists important clues to the nature and evolution of the early Universe. In particular, measurement of the ratio of the normal isotope of hydrogen to its heavier isotope known as deuterium provides important insight into primordial nucleosynthesis.
- - what are superstrings?
  - 'For the last 20 years of his life, Albert Einstein was something of an oddity in the physics community, like a beloved eccentric uncle whose favorite subject of conversation draws embarrassed looks around the table. While quantum theory, the theory of the infinitesimally small, was being tested with accuracy never attained before, he refused to accept that it was the ultimate theory. For the last years of his life, he worked on a way to reconcile his own theory of gravitation and the quantum description of the world. He didn''t succeed and died without seeing his dearest dream realized. More than 40 years later, Einstein is almost vindicated: The long lasting problem of incompatibility between general relativity and quantum mechanics seems to be on its way to a resolution. The solution may be difficult to grasp. If the handful of physicists involved in what are called "superstring theories" (or string, for short) are correct, we live in a world weirder than you can probably imagine.'
- - how do we measure the size and the age of the universe?
  - 'Astronomers estimate that the Big Bang occurred between 10 and 20 billion years ago. They estimate the age of the Universe in two ways: (a) by looking for the oldest stars; and (b) by measuring the rate of expansion of the Universe and extrapolating back to the Big Bang. The Oldest Stars Astronomers can figure out the ages of some of the oldest stars in the Universe by studying globular clusters. A globular cluster is a dense collection of close to a million stars, all of which formed at roughly the same time. The density of stars near the center of a globular cluster is enormous. If we lived near the center of a globular cluster, there would be several hundred thousand stars closer to us than Alpha Centauri, our current nearest stellar neighbor. The life cycle of a star depends upon its mass. High mass stars are much brighter than low mass stars; thus they rapidly burn through their supply of hydrogen fuel. A star like the Sun has enough fuel in its core to burn at its current brightness
    for approximately 9 billion years. A star that is twice as massive as the Sun will burn through its fuel supply in only 800 million years. A 10 solar mass star (a star that is 10 times more massive than the Sun) burns nearly a thousand times brighter and has only a 20 million year fuel supply. Conversely, a star that is half as massive as the Sun burns slowly enough for its fuel to last more than 20 billion years. Since all of the stars in a globular cluster formed at roughly the same time, these clusters can serve as cosmic clocks. If a globular cluster is more than 10 million years old, then all of its hydrogen burning stars will be less massive than 10 solar masses. This implies that no individual hydrogen burning star will be more than 1000 times brighter than the Sun. If a globular cluster is more than 2 billion years old, then there will be no hydrogen-burning star more massive than 2 solar masses. The oldest globular clusters contain only stars less massive than 0.7 solar masses.
    These low mass stars are much dimmer than the Sun. This suggests that the oldest globular clusters are between 11 and 18 billion years old. The uncertainty in this estimate is due to the difficulty in determining the exact distance to a globular cluster (hence, an uncertainty in the brightness (and mass) of the stars in the cluster). Another source of uncertainty in this estimate lies in our ignorance of some of the finer details of stellar evolution. Extrapolating Back to the Big Bang Another way to estimate the age of the Universe is to measure the "Hubble constant". The Hubble constant (H0) is a measure of the current expansion rate of the Universe. Cosmologists use this measurement to extrapolate back to the Big Bang. This extrapolation depends upon the current density of the Universe and on the composition of the Universe. If the Universe is flat and composed mostly of matter, then the age of the Universe is 2/(3 H0). If the Universe has a very low density of matter, then its extrapolated
    age is larger: 1/H0. If the theory of general relativity is modified to include a cosmological constant, then the inferred age can be even larger. Many astronomers are working hard to measure the Hubble constant using a variety of different techniques. The current best estimates of H0 range from 50 kilometers/sec/Megaparsec to 100 km/s/Megaparsec. In more familiar units, astronomers believe that 1/H0 is between 10 and 20 billion years. If we compare the two age determinations, there is a potential crisis. If the astronomers who estimate that 1/H0 is as small as 10 Billion years are correct, then the age of the Universe would be shorter than the age of its oldest stars. This contradiction implies that either the Big Bang theory is incorrect or that we need to modify general relativity by adding a cosmological constant. Some astronomers believe that this crisis will pass as soon as our measurements improve. If the astronomers who have measured the larger values of 1/H0 are correct and
    the smaller estimates of globular cluster ages are also correct, then all may be well for the Big Bang theory. Thank you to the MAP project for contributing to this article. Find out about the Microwave Anisotropy Probe at https://map.gsfc.nasa.gov. The Oldest Stars Astronomers can figure out the ages of some of the oldest stars in the Universe by studying globular clusters. A globular cluster is a dense collection of close to a million stars, all of which formed at roughly the same time. The density of stars near the center of a globular cluster is enormous. If we lived near the center of a globular cluster, there would be several hundred thousand stars closer to us than Alpha Centauri, our current nearest stellar neighbor. The life cycle of a star depends upon its mass. High mass stars are much brighter than low mass stars; thus they rapidly burn through their supply of hydrogen fuel. A star like the Sun has enough fuel in its core to burn at its current brightness for approximately
    9 billion years. A star that is twice as massive as the Sun will burn through its fuel supply in only 800 million years. A 10 solar mass star (a star that is 10 times more massive than the Sun) burns nearly a thousand times brighter and has only a 20 million year fuel supply. Conversely, a star that is half as massive as the Sun burns slowly enough for its fuel to last more than 20 billion years. Since all of the stars in a globular cluster formed at roughly the same time, these clusters can serve as cosmic clocks. If a globular cluster is more than 10 million years old, then all of its hydrogen burning stars will be less massive than 10 solar masses. This implies that no individual hydrogen burning star will be more than 1000 times brighter than the Sun. If a globular cluster is more than 2 billion years old, then there will be no hydrogen-burning star more massive than 2 solar masses. The oldest globular clusters contain only stars less massive than 0.7 solar masses. These low mass
    stars are much dimmer than the Sun. This suggests that the oldest globular clusters are between 11 and 18 billion years old. The uncertainty in this estimate is due to the difficulty in determining the exact distance to a globular cluster (hence, an uncertainty in the brightness (and mass) of the stars in the cluster). Another source of uncertainty in this estimate lies in our ignorance of some of the finer details of stellar evolution. Extrapolating Back to the Big Bang Another way to estimate the age of the Universe is to measure the "Hubble constant". The Hubble constant (H0) is a measure of the current expansion rate of the Universe. Cosmologists use this measurement to extrapolate back to the Big Bang. This extrapolation depends upon the current density of the Universe and on the composition of the Universe. If the Universe is flat and composed mostly of matter, then the age of the Universe is 2/(3 H0). If the Universe has a very low density of matter, then its extrapolated age
    is larger: 1/H0. If the theory of general relativity is modified to include a cosmological constant, then the inferred age can be even larger. Many astronomers are working hard to measure the Hubble constant using a variety of different techniques. The current best estimates of H0 range from 50 kilometers/sec/Megaparsec to 100 km/s/Megaparsec. In more familiar units, astronomers believe that 1/H0 is between 10 and 20 billion years. If we compare the two age determinations, there is a potential crisis. If the astronomers who estimate that 1/H0 is as small as 10 Billion years are correct, then the age of the Universe would be shorter than the age of its oldest stars. This contradiction implies that either the Big Bang theory is incorrect or that we need to modify general relativity by adding a cosmological constant. Some astronomers believe that this crisis will pass as soon as our measurements improve. If the astronomers who have measured the larger values of 1/H0 are correct and the
    smaller estimates of globular cluster ages are also correct, then all may be well for the Big Bang theory. Thank you to the MAP project for contributing to this article. Find out about the Microwave Anisotropy Probe at https://map.gsfc.nasa.gov.'
- - what is a comet?
  - 'Comets are basically dusty snowballs which orbit the Sun. They are made of ices, such as water, carbon dioxide, ammonia and methane, mixed with dust. These materials came from the time when the Solar System was formed. Comets have an icy center (nucleus) surrounded by a large cloud of gas and dust (called the coma). The coma is created as the ice in the nucleus is warmed by the Sun and vaporizes. Comets can develop two tails as they travel closer to the Sun: a straight gas tail and a curved dust tail. The gas tail is created by the solar wind, pushing gas away from the comet''s coma and pointing straight back from the Sun. The dust in the coma is not affected by magnetic fields but is vaporized by the Sun''s heat, and forms a curved tail which follows the comet''s orbit.'
